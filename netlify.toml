# Netlify — hosts the Next.js frontend. Site settings → Build: base "frontend" is set here.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # Render backend (Site configuration → Environment variables overrides this).
  NEXT_PUBLIC_API_URL = "https://ecoloop-backend-7c5l.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"
